<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- black: 화면이 상단 상태 막대(20pt) 아래에서 시작 → 아이패드 에어 3 가로에서 창이 1112×814 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="대시보드">
<meta name="theme-color" content="#000000">
<title>대시보드</title>
<style id="main-css">
  /* =====================================================================
     디자인: Claude Design 캔버스(1112×814)를 그대로 옮김
     - 화면 전체를 1112×814 무대(#stage) 하나로 만들고, 창 크기에 맞춰 통째로 확대/축소
       (아이패드 에어 3 홈 화면 앱에서는 창이 정확히 1112×814라서 배율 1)
     - 글꼴: 시스템 글꼴 / 굵기 400·500·700
     ===================================================================== */
  :root{
    --bg:#000000; --card:#1F222A; --sheet:#1A1D24; --line:#2C2F37;
    --text:#E6E9ED; --sub:#B0B8C1; --ter:#8B95A1; --dim:#4E5968;
    --crimson:#8A1538; --blue:#003876; --err:#E3A957;
    --good:#79A3E3; --ok:#4DB6A8; --bad:#E3A957; --worst:#E0607A;
    --ease:cubic-bezier(.22,.9,.24,1); --dur:.55s;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
    -webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
  body{position:fixed;inset:0}   /* 홈 화면 앱에서 화면이 위아래로 끌려 움직이지 않게 */
  .num{font-variant-numeric:tabular-nums}
  .tap{cursor:pointer}

  /* 무대: 1112×814 고정, 스크립트(fitStage)가 창 가운데에 맞춰 배율만 바꿈 */
  #stage{position:absolute;left:0;top:0;width:1112px;height:814px;transform-origin:0 0;overflow:hidden;background:var(--bg)}

  /* 기본 화면: 바깥 여백 25 · 칸 간격 17 · 38:62 두 열 · 윗줄 242 */
  #app{position:absolute;inset:0;padding:25px;display:grid;gap:17px;
    grid-template-columns:minmax(0,38fr) minmax(0,62fr);grid-template-rows:242px minmax(0,1fr)}

  /* ===== 시계 (시계 모드와 같은 모양) — 시세 카드 줄 높이 안에서 세로 가운데 ===== */
  .a-clock{display:flex;flex-direction:column;justify-content:center;align-items:center;padding-top:39px;min-width:0;min-height:0}
  .tset{display:flex;flex-direction:column;align-items:center}
  .t-time{font-size:133px;font-weight:700;line-height:.9;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .t-date{margin-top:12px;font-size:31px;font-weight:500;color:var(--sub);letter-spacing:-.01em;white-space:nowrap}

  /* ===== 장 상태 + 시세 카드 3개 ===== */
  .a-mtop{display:grid;grid-template-rows:auto minmax(0,1fr);gap:13px;min-width:0;min-height:0}
  .sessions{height:26px;display:flex;align-items:center;justify-content:center;gap:32px;white-space:nowrap;overflow:hidden}
  .sess{display:flex;align-items:center;gap:8px;font-size:22px;line-height:1.2}
  .sess .dot{width:12px;height:12px;flex:none;border-radius:50%;background:var(--dim)}
  .sess .name{font-weight:500;color:var(--sub)}
  .sess .state{font-weight:700;color:var(--sub)}
  .sess.open .dot{background:var(--blue)}                                   /* 정규장: 채운 점 */
  .sess.ext .dot{background:transparent;border:2.5px solid var(--blue)}    /* 프리·애프터·데이마켓: 테두리 점 */
  .sess.open .state,.sess.ext .state{color:var(--text)}
  #row-stocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;min-height:0}

  /* ===== 날씨 열 ===== */
  .a-weather{display:grid;grid-template-rows:102px minmax(0,1fr);gap:17px;min-width:0;min-height:0}
  .card{background:var(--card);border-radius:20px;padding:20px;min-width:0;min-height:0}

  /* 현재 날씨: [아이콘 기온] ··· [미세/초미세 등급] */
  .now{display:flex;align-items:center;justify-content:space-between;gap:12px;overflow:hidden}
  .now-l{display:flex;align-items:center;gap:12px;flex:none;height:62px}
  #w-icon{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;line-height:0}
  #w-icon svg{display:block}
  #w-temp{font-size:62px;font-weight:700;line-height:1;text-box:trim-both cap alphabetic;letter-spacing:-.02em;
    padding-right:.3em;position:relative;white-space:nowrap;font-variant-numeric:tabular-nums}
  #w-temp .deg{position:absolute;top:0;font-weight:400;line-height:1;text-box:trim-both cap alphabetic}
  #w-air{display:grid;grid-template-columns:auto 86px;grid-auto-rows:26px;column-gap:8px;row-gap:10px;align-items:center;
    font-size:22px;line-height:1;white-space:nowrap;flex:none}
  #w-air span{font-weight:500;color:var(--sub)}
  #w-air b{font-weight:700}

  /* 오늘/내일 카드: 제목 ↔ 최저·최고 ↔ 강수 (간격 20) */
  .day{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:20px}
  #day-title{display:flex;align-items:center;gap:12px;height:34px}
  .tag{flex:none;height:34px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;border-radius:17px;
    color:#FFFFFF;font-size:19px;font-weight:700;line-height:1;text-box:trim-both cap alphabetic}
  .tag.today{background:var(--crimson)}
  .tag.tmr{background:var(--blue)}
  #d-icon{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;line-height:0}
  #d-icon svg{display:block}
  #d-desc{height:34px;display:inline-flex;align-items:center;font-size:28px;font-weight:700;line-height:1;letter-spacing:-.01em;
    white-space:nowrap;text-box:trim-both cap alphabetic}

  .temps{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);column-gap:20px}
  .temps .t{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
  .temps .vline{background:var(--line)}
  .label{font-size:22px;font-weight:500;line-height:1.2;color:var(--sub);white-space:nowrap}
  .temps .v{font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;position:relative;padding-right:.3em}
  .temps .v .deg{position:absolute;font-weight:400}

  .rain-sec{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:20px;border-top:1px solid var(--line);padding-top:20px;min-height:0}
  .rain-num{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-end;gap:4px}
  #d-rain{font-size:37px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  #d-rain .pct{font-size:.5em;font-weight:500}
  #rain-chart{position:relative;min-width:0;min-height:0}
  #rain-chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

  /* ===== 시총 목록 ===== */
  .a-mbody{display:grid;min-width:0;min-height:0}

  /* ===== 시세 위젯 (TradingView) — 카드 사각형을 통째로 채움 ===== */
  .tile{background:var(--card);border-radius:20px;overflow:hidden;position:relative;min-height:0;min-width:0;
    pointer-events:none}   /* 터치 잠금: 눌러도 TradingView 사이트로 넘어가지 않음 */
  .tv-inner{position:absolute;left:0;top:0;width:calc(100% / var(--z,1));height:calc(100% / var(--z,1));
    transform:scale(var(--z,1));transform-origin:0 0}
  .tile.screener{display:flex;align-items:center;justify-content:center}
  .clip{position:relative;overflow:hidden;flex:none}
  .tv-inner .tradingview-widget-container,
  .tv-inner .tradingview-widget-container__widget{width:100%;height:100%}

  /* ===== 바깥 아래 여백(25px) 한 줄: 왼쪽 열 오른쪽 끝 = 갱신 시각 / 오른쪽 열 오른쪽 끝 = 오류 ===== */
  #foot{position:absolute;left:25px;right:25px;bottom:0;height:25px;display:grid;
    grid-template-columns:minmax(0,38fr) minmax(0,62fr);column-gap:17px;align-items:center;
    font-size:17px;font-weight:500;line-height:1;white-space:nowrap}
  #stamp{text-align:right;color:var(--ter);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
  #status{text-align:right;color:var(--err);overflow:hidden;text-overflow:ellipsis}

  /* ===== 시계 모드 (00~06시 자동 / 큰 시계를 눌러서) — 아무 곳이나 누르면 원래 화면 ===== */
  /* 전환 모션: 기본 화면 큰 시계 자리에서 커지며 나타나고, 기본 화면은 살짝 커지며 사라짐 (반대도 동일) */
  #clockview{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-evenly;background:var(--bg);
    opacity:0;visibility:hidden;pointer-events:none;transform:scale(.42);transform-origin:var(--ox,25%) var(--oy,20%);
    transition:opacity .38s ease,transform var(--dur) var(--ease),visibility 0s linear var(--dur)}
  #app{transform-origin:var(--ox,25%) var(--oy,20%);
    transition:opacity .45s ease .05s,transform var(--dur) var(--ease),visibility 0s linear 0s}
  body.clockmode #clockview{opacity:1;visibility:visible;pointer-events:auto;transform:none;
    transition:opacity .38s ease,transform var(--dur) var(--ease),visibility 0s}
  body.clockmode #app{opacity:0;transform:scale(1.08);visibility:hidden;pointer-events:none;
    transition:opacity .3s ease,transform var(--dur) var(--ease),visibility 0s linear var(--dur)}
  @media (prefers-reduced-motion: reduce){ #clockview,#app{transition:none !important} }

  #analog{width:617px;height:617px;flex:none}
  #analog .face{fill:var(--sheet)}
  #analog .tk{stroke:var(--dim);stroke-linecap:round}
  #analog .tk.major{stroke:var(--text)}
  #analog .hh,#analog .mh{fill:var(--text)}
  #analog .sh{stroke:var(--blue);fill:var(--blue)}
  #analog .cap{fill:var(--bg);stroke:var(--blue);stroke-width:1.6}
  #analog .hh,#analog .mh,#analog .sh{transform-origin:100px 100px}   /* 회전 중심(100,100), 초침은 1초마다 끊어서 이동 */
  .digi-box{width:360px;flex:none}   /* 폭 고정: 숫자 폭이 바뀌어도 원형 시계가 움직이지 않게 */

  /* 미니 달력: 오늘만 크림슨 원, 주말은 3차 글자색 */
  .cal{margin-top:43px;display:grid;grid-template-columns:repeat(7,41px);gap:7px;justify-content:center}
  .cal .w{font-size:17px;font-weight:500;color:var(--ter);text-align:center}
  .cal .d{width:37px;height:37px;line-height:37px;margin:0 auto;border-radius:50%;text-align:center;
    font-size:22px;font-variant-numeric:tabular-nums;color:var(--text)}
  .cal .d.we{color:var(--ter)}
  .cal .d.today{background:var(--crimson);color:#FFFFFF;font-weight:700}
</style>
</head>
<body>
<div id="stage">
  <div id="app">
    <section class="a-clock">
      <div class="tset tap" id="clock-set" role="button" aria-label="시계 모드로 전환">
        <div id="clock" class="t-time">--:--</div>
        <div id="date" class="t-date">&nbsp;</div>
      </div>
    </section>

    <section class="a-mtop">
      <div class="sessions" role="status">
        <div class="sess" id="sess-kr"><span class="dot"></span><span class="name">한국</span><span class="state">-</span></div>
        <div class="sess" id="sess-us"><span class="dot"></span><span class="name">미국</span><span class="state">-</span></div>
      </div>
      <div id="row-stocks"></div>
    </section>

    <section class="a-weather">
      <div class="card now">
        <div class="now-l">
          <div id="w-icon"></div>
          <div id="w-temp">-</div>
        </div>
        <div id="w-air"></div>
      </div>

      <div class="card day tap" id="day" role="button" aria-label="오늘·내일 날씨 바꿔 보기">
        <div id="day-title">&nbsp;</div>
        <div class="temps">
          <div class="t"><div class="label">최저</div><div id="d-min" class="v">-</div></div>
          <div class="vline"></div>
          <div class="t"><div class="label">최고</div><div id="d-max" class="v">-</div></div>
        </div>
        <div class="rain-sec">
          <div class="rain-num"><div class="label">강수확률</div><div id="d-rain">-</div></div>
          <div id="rain-chart"></div>
        </div>
      </div>
    </section>

    <section class="a-mbody" id="row-group"></section>

    <div id="foot">
      <div id="stamp"></div>
      <div id="status"></div>
    </div>
  </div>

  <div id="clockview" class="tap" aria-label="시계 모드 — 누르면 원래 화면">
    <svg id="analog" viewBox="0 0 200 200"></svg>
    <div class="digi-box tset">
      <div id="digital" class="t-time">--:--</div>
      <div id="cv-date" class="t-date">&nbsp;</div>
      <div class="cal" id="cal"></div>
    </div>
  </div>
</div>

<script id="main-js">
/* =====================================================================
   설정 — 여기만 고치면 돼요
   (GitHub Pages는 공개 페이지라서 개인 정보는 넣지 마세요)
   ===================================================================== */
const CONFIG = {
  // 위치 (기본: 성남시청). 서울시청은 37.5665, 126.9780
  LOCATION: { name: "성남", lat: 37.4200, lon: 127.1267 },

  // 이 시각 이후로는 날씨 카드가 '내일' 기준으로 바뀌어요
  TOMORROW_FROM_HOUR: 18,

  // 야간 시계 모드: 이 시간에는 자동으로 시계 모드 (터치하면 원래 화면, 손 떼고 IDLE_SEC초 뒤 다시 시계 모드)
  NIGHT: { start: "00:00", end: "06:00", IDLE_SEC: 15 },

  // 위 줄 시세 카드 (TradingView 심볼, 위젯 안에 표시될 이름)
  // 한국거래소(KRX) 종목은 TradingView 위젯에서 막혀 있어서 넣어도 안 나와요
  STOCKS: [
    ["AMEX:SPYM",     "SPYM"],
    ["AMEX:XLV",      "XLV"],
    ["FX_IDC:USDKRW", "USD/KRW"],
  ],

  // 시세 카드 위젯 확대 배율 (1보다 크면 글씨가 커져요)
  ZOOM_STOCK: 1.0,

  // 시세 위젯 언어: "en"(영어) / "kr"(한국어). 한국어는 번역이 어색해서 영어 권장
  TV_LOCALE: "en",

  // 시총 목록(TradingView 스크리너, 미국 시총 순 자동 정렬) 보이는 범위
  // - 열은 지정할 수 없어서, 위젯을 넓게 그린 뒤 왼쪽 일부만 잘라서 보여줘요
  // - VISIBLE_W: 위젯 원래 크기 기준 보여줄 폭(px). 'Technical Rating' 열 오른쪽 끝에 맞춘 값
  //   열이 잘리면 늘리고, 다음 열(Volume)이 삐져나오면 줄이세요
  // - INNER_W: 위젯을 그릴 전체 폭(px) / ROW_PX·HEAD_PX: 한 줄 / 머리 부분 높이(px)
  // - FIT: "width" → 카드 가로를 꽉 채움 / "rows" → SHOW_ROWS 줄이 다 보이게 맞춤
  SCREENER: { FIT: "width", SHOW_ROWS: 10, VISIBLE_W: 505, INNER_W: 900, ROW_PX: 49, HEAD_PX: 48 },

  REFRESH_WEATHER_MIN: 10,               // 날씨·미세먼지 함께 갱신하는 주기(분)
  RELOAD_PAGE_HOURS: 6,
  UPDATE_CHECK_MIN: 5,                   // GitHub에 새 버전이 있는지 확인하는 주기(분). 화면이 켜질 때도 바로 확인
};

/* ===================================================================== */
const TZ = "Asia/Seoul";
const STAGE_W = 1112, STAGE_H = 814;
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const body = document.body;

/* ---------- 무대 배율: 창 안에 1112×814를 통째로 맞추고 가운데 정렬 ---------- */
let stageScale = 1;
function fitStage() {
  const s = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
  stageScale = s;
  const x = (innerWidth - STAGE_W * s) / 2, y = (innerHeight - STAGE_H * s) / 2;
  $("stage").style.transform = `translate(${x}px, ${y}px) scale(${s})`;
}
fitStage();

// 점검용: 주소 끝에 ?debug 를 붙이면 창 크기와 배율을 왼쪽 위에 작게 표시
if (/[?&]debug\b/.test(location.search)) addEventListener("load", () => {
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:4px;top:4px;z-index:99;font:12px/1.4 monospace;background:#000c;color:#ff0;padding:4px 6px;pointer-events:none";
  document.body.append(box);
  const upd = () => { box.textContent = `창 ${innerWidth}×${innerHeight} · 배율 ${stageScale.toFixed(3)} · dpr ${devicePixelRatio}`; };
  upd(); addEventListener("resize", upd);
});

const _fmt = {};                                       // 시간대별 날짜 형식기 캐시
function partsIn(tz, d = new Date()) {
  const f = _fmt[tz] || (_fmt[tz] = new Intl.DateTimeFormat("en-US", { timeZone: tz, hour12: false,
    weekday: "short", hour: "2-digit", minute: "2-digit", year: "numeric", month: "2-digit", day: "2-digit" }));
  const o = Object.fromEntries(f.formatToParts(d).map(p => [p.type, p.value]));
  const hour = Number(o.hour) % 24;
  return { wd: o.weekday, h: hour, m: Number(o.minute), mins: hour * 60 + Number(o.minute),
           ymd: `${o.year}-${o.month}-${o.day}` };
}
const toMins = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };

// 실패하기 쉬운 요청: 최대 3회, 지연(3초·6초) 후 재시도, 15초 안에 응답 없으면 끊고 재시도
async function fetchJSON(url, tries = 3, delayMs = 3000, timeoutMs = 15000) {
  for (let i = 1; i <= tries; i++) {
    const ac = new AbortController(), timer = setTimeout(() => ac.abort(), timeoutMs);
    try {
      const r = await fetch(url, { cache: "no-store", signal: ac.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) {
      if (i === tries) throw e;
      await new Promise(res => setTimeout(res, delayMs * i));
    } finally {
      clearTimeout(timer);
    }
  }
}

/* ---------- 아래 한 줄: 갱신 시각(항상) / 오류(있을 때만) ---------- */
const statusMsgs = {};
function setStatus(key, msg) {
  statusMsgs[key] = msg;
  $("status").textContent = Object.values(statusMsgs).filter(Boolean).join("  ·  ");
}
const stampNow = () => { const d = new Date(), p = partsIn(TZ, d); return `${pad(p.h)}:${pad(p.m)}:${pad(d.getSeconds())}`; };
function setStamp() {
  $("stamp").textContent = `날씨 ${stampNow()} 업데이트 · ${CONFIG.REFRESH_WEATHER_MIN}분마다`;
}

/* ---------- 시계 ---------- */
function renderClock() {
  const now = new Date(), p = partsIn(TZ, now);
  $("clock").textContent = `${pad(p.h)}:${pad(p.m)}`;
  _fmt.date = _fmt.date || new Intl.DateTimeFormat("ko-KR", { timeZone: TZ, month: "long", day: "numeric", weekday: "long" });
  const ds = _fmt.date.format(now);
  if ($("date").textContent !== ds) $("date").textContent = ds;

/* ---------- 장 상태 ----------
   국장(KST): 08:00 프리마켓(NXT) → 09:00 정규장 → 15:30 애프터마켓(NXT) → 20:00 마감
   미장(ET, 서머타임 자동): 04:00 프리 → 09:30 정규 → 16:00 애프터 → 20:00 데이마켓(주간거래) → 다음날 04:00
   데이마켓은 일~목 20:00(ET)에 열려서 월~금 04:00(ET)까지. 공휴일은 반영 안 함 */
function krSession() {
  const p = partsIn(TZ);
  if (["Sat", "Sun"].includes(p.wd)) return { cls: "", state: "휴장" };
  const t = p.mins, S = [["08:00", "09:00", "ext", "프리마켓"], ["09:00", "15:30", "open", "정규장"], ["15:30", "20:00", "ext", "애프터마켓"]];
  for (const [a, b, cls, state] of S) if (t >= toMins(a) && t < toMins(b)) return { cls, state };
  return { cls: "", state: "장 마감" };
}
function usSession() {
  const p = partsIn("America/New_York"), t = p.mins, wd = p.wd;
  const weekday = !["Sat", "Sun"].includes(wd);
  if (weekday && t >= toMins("04:00") && t < toMins("09:30")) return { cls: "ext", state: "프리마켓" };
  if (weekday && t >= toMins("09:30") && t < toMins("16:00")) return { cls: "open", state: "정규장" };
  if (weekday && t >= toMins("16:00") && t < toMins("20:00")) return { cls: "ext", state: "애프터마켓" };
  const eveningOpen = ["Sun", "Mon", "Tue", "Wed", "Thu"].includes(wd) && t >= toMins("20:00");
  const morningOpen = ["Mon", "Tue", "Wed", "Thu", "Fri"].includes(wd) && t < toMins("04:00");
  if (eveningOpen || morningOpen) return { cls: "ext", state: "데이마켓" };
  return { cls: "", state: "휴장" };
}
function renderSessions() {
  [["sess-kr", krSession()], ["sess-us", usSession()]].forEach(([id, s]) => {
    const el = $(id);
    el.className = "sess " + s.cls;
    el.querySelector(".state").textContent = s.state;
  });
}

/* ---------- 날씨 ---------- */
const ICONS = {
  sun:   '<circle cx="32" cy="32" r="11"/>' + [0,45,90,135,180,225,270,315].map(a => `<line x1="32" y1="7" x2="32" y2="13" transform="rotate(${a} 32 32)"/>`).join(""),
  moon:  '<path d="M40 12a20 20 0 1 0 12 30A16 16 0 0 1 40 12z"/>',
  cloud: '<path d="M20 46h26a10 10 0 0 0 0-20 14 14 0 0 0-27-3A11 11 0 0 0 20 46z"/>',
  partly:'<circle cx="24" cy="22" r="8"/><line x1="24" y1="6" x2="24" y2="10"/><line x1="10" y1="22" x2="14" y2="22"/><line x1="14" y1="12" x2="17" y2="15"/><path d="M24 50h22a9 9 0 0 0 0-18 12 12 0 0 0-23-2A9 9 0 0 0 24 50z"/>',
  rain:  '<path d="M20 38h26a10 10 0 0 0 0-20 14 14 0 0 0-27-3A11 11 0 0 0 20 38z"/><line x1="22" y1="44" x2="19" y2="52"/><line x1="32" y1="44" x2="29" y2="52"/><line x1="42" y1="44" x2="39" y2="52"/>',
  snow:  '<path d="M20 38h26a10 10 0 0 0 0-20 14 14 0 0 0-27-3A11 11 0 0 0 20 38z"/><circle cx="22" cy="48" r="1.6"/><circle cx="32" cy="52" r="1.6"/><circle cx="42" cy="48" r="1.6"/>',
  fog:   '<line x1="12" y1="26" x2="52" y2="26"/><line x1="16" y1="34" x2="48" y2="34"/><line x1="12" y1="42" x2="52" y2="42"/>',
  storm: '<path d="M20 36h26a10 10 0 0 0 0-20 14 14 0 0 0-27-3A11 11 0 0 0 20 36z"/><polyline points="34,38 28,47 35,47 30,56"/>',
};
function wmo(code, isDay = 1) {
  if (code === 0) return ["맑음", isDay ? "sun" : "moon"];
  if (code === 1) return ["대체로 맑음", isDay ? "sun" : "moon"];
  if (code === 2) return ["구름 조금", "partly"];
  if (code === 3) return ["흐림", "cloud"];
  if (code === 45 || code === 48) return ["안개", "fog"];
  if (code >= 51 && code <= 57) return ["이슬비", "rain"];
  if (code >= 61 && code <= 67) return ["비", "rain"];
  if (code >= 71 && code <= 77) return ["눈", "snow"];
  if (code >= 80 && code <= 82) return ["소나기", "rain"];
  if (code >= 85 && code <= 86) return ["눈 소나기", "snow"];
  if (code >= 95) return ["뇌우", "storm"];
  return ["-", "cloud"];
}
// 현재 날씨 44px·선 3.4 / 날씨 카드 30px·선 4 (캔버스 기준)
const svgIcon = (k, size, stroke) => `<svg viewBox="0 0 64 64" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k] || ICONS.cloud}</svg>`;

// 기온: 진짜 마이너스 기호(−) + 폭에서 빠지는 매달린 '°'
const degHTML = (v) => {
  if (v == null || !isFinite(v)) return "-";                   // 값이 비어 오면 0°로 보이지 않게
  const n = Math.round(v); return `${n < 0 ? "−" + Math.abs(n) : n}<span class="deg">°</span>`;
};
let lastWeather = null;

let weatherBusy = false;
async function updateWeather() {
  if (weatherBusy) return;                                       // 이미 받는 중이면 겹쳐 부르지 않음
  weatherBusy = true;
  const { lat, lon } = CONFIG.LOCATION;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&current=temperature_2m,weather_code,is_day`
    + `&hourly=precipitation_probability`
    + `&daily=temperature_2m_max,temperature_2m_min,weather_code`
    + `&timezone=${encodeURIComponent(TZ)}&forecast_days=3`;
  try {
    const d = await fetchJSON(url);
    lastWeather = d;
    const c = d.current, [desc, icon] = wmo(c.weather_code, c.is_day);
    $("w-icon").innerHTML = svgIcon(icon, 44, 3.4);
    $("w-icon").setAttribute("aria-label", desc);
    $("w-temp").innerHTML = degHTML(c.temperature_2m);
    renderDay();
    setStamp();
    setStatus("w", "");
  } catch (e) {
    setStatus("w", "날씨 갱신 실패(다음 주기에 재시도)");
  } finally {
    weatherBusy = false;
  }

/* 날씨 카드 누르기: 오늘 ↔ 내일을 15초 동안 바꿔 보여주고, 그 뒤 시간대에 맞는 쪽으로 돌아감
   바뀔 때는 줄어들며 사라지고(0.18초) → 커지며 나타나는(0.48초) 모션 */
let dayPeek = null;                                   // { view: "today"|"tmr", timer }
const PEEK_SEC = 15;
async function swapDay(update) {
  const els = [...$("day").children];
  const ease = "cubic-bezier(.22,.9,.24,1)";
  if (!els[0].animate || document.hidden || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    els.forEach(el => el.getAnimations && el.getAnimations().forEach(a => a.cancel()));
    update(); return;
  }
  const outs = els.map(el => el.animate(
    [{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(.94)" }],
    { duration: 180, easing: "ease-in" }));
  await Promise.race([Promise.all(outs.map(a => a.finished)).catch(() => {}), new Promise(r => setTimeout(r, 300))]);
  try { update(); }
  finally {
    els.forEach(el => {
      el.getAnimations().forEach(a => a.cancel());
      el.animate([{ opacity: 0, transform: "scale(1.05)" }, { opacity: 1, transform: "scale(1)" }], { duration: 480, easing: ease });
    });
    // 안전장치: 0.7초 뒤에도 모션이 남아 있으면 모두 걷어내서 내용이 반드시 보이게
    setTimeout(() => els.forEach(el => el.getAnimations().forEach(a => a.cancel())), 700);
  }
}
const defaultView = () => partsIn(TZ).h >= CONFIG.TOMORROW_FROM_HOUR ? "tmr" : "today";
function endPeek() {
  if (!dayPeek) return;
  clearTimeout(dayPeek.timer);
  dayPeek = null;
  if ($("day").dataset.view !== defaultView()) swapDay(renderDay); else renderDay();
}
$("day").addEventListener("click", () => {
  if (!lastWeather) return;
  const shown = $("day").dataset.view || "today";
  const next = shown === "today" ? "tmr" : "today";
  if (dayPeek) clearTimeout(dayPeek.timer);
  // 시간대 기본 화면으로 되돌리는 터치면 타이머 없이 그대로, 반대쪽을 보는 경우에만 15초 뒤 복귀
  dayPeek = next === defaultView() ? null : { view: next, timer: setTimeout(endPeek, PEEK_SEC * 1000) };
  swapDay(renderDay);
});

function renderDay() {
  const d = lastWeather;
  if (!d) return;
  const p = partsIn(TZ);
  const todayIdx = d.daily.time.indexOf(p.ymd);                    // 받아온 예보 중 '오늘'이 몇 번째인지 런타임으로 확인
  if (todayIdx < 0) {                                              // 예보가 날짜를 못 따라오면(자정 직후 등) 새로 받기 (1분에 한 번만)
    if (Date.now() - (renderDay.lastForce || 0) > 60 * 1000) { renderDay.lastForce = Date.now(); updateWeather(); }
    return;
  }
  const hasTmr = todayIdx + 1 < d.daily.time.length;
  const want = dayPeek ? dayPeek.view : defaultView();
  const isTmr = want === "tmr" && hasTmr;
  $("day").dataset.view = isTmr ? "tmr" : "today";
  const idx = todayIdx + (isTmr ? 1 : 0);
  const dayStr = d.daily.time[idx];
  const [ddesc, dicon] = wmo(d.daily.weather_code[idx]);
  $("day-title").innerHTML = (isTmr ? `<span class="tag tmr">내일</span>` : `<span class="tag today">오늘</span>`)
    + `<div id="d-icon">${svgIcon(dicon, 30, 4)}</div><span id="d-desc">${ddesc}</span>`;
  $("d-max").innerHTML = degHTML(d.daily.temperature_2m_max[idx]);
  $("d-min").innerHTML = degHTML(d.daily.temperature_2m_min[idx]);
  const hours = [], probs = [];
  d.hourly.time.forEach((t, i) => { if (t.startsWith(dayStr)) { hours.push(Number(t.slice(11, 13))); probs.push(d.hourly.precipitation_probability[i] ?? 0); } });
  // 큰 숫자 = 그래프와 같은 시간별 값의 최댓값 → 숫자와 그래프 최고점이 항상 일치
  $("d-rain").innerHTML = `${probs.length ? Math.max(...probs) : 0}<span class="pct">%</span>`;
  drawRainChart(hours, probs, isTmr ? null : p.h + p.m / 60);
}

/* 강수 그래프 (캔버스 249×174 기준: 그래프 위 20 · 아래 26 · 왼쪽 4 · 오른쪽 10 여백, 눈금 글자 14px)
   지나간 시간은 회색으로 흐리게, 지금 시각은 점선, 최고점은 점 + '17시 60%' */
let lastRain = null;
function drawRainChart(hours, probs, nowH) {
  lastRain = [hours, probs, nowH];
  const box = $("rain-chart");
  const W = box.clientWidth, H = box.clientHeight;
  if (!probs.length) { box.innerHTML = ""; return; }
  if (!W || !H) { requestAnimationFrame(() => box.clientHeight && drawRainChart(hours, probs, nowH)); return; }
  const C = { blue: "#003876", line: "#2C2F37", sub: "#B0B8C1", text: "#E6E9ED", card: "#1F222A" };
  const FONT = `font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif"`;
  const padL = 4, padR = 10, padT = 20, padB = 26;
  const x = (h) => padL + (h / 23) * (W - padL - padR);
  const y = (v) => padT + (1 - v / 100) * (H - padT - padB);
  const pts = probs.map((v, i) => [x(hours[i]), y(v)]);
  const f = (n) => n.toFixed(1);

  // 부드러운 곡선 (가벼운 카디널 스플라인, 0~100 범위로 제한)
  const clampY = (v) => Math.min(y(0), Math.max(y(100), v));
  let path = `M${f(pts[0][0])},${f(pts[0][1])}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2, k = 0.18;
    path += ` C${f(p1[0] + (p2[0] - p0[0]) * k)},${f(clampY(p1[1] + (p2[1] - p0[1]) * k))} ${f(p2[0] - (p3[0] - p1[0]) * k)},${f(clampY(p2[1] - (p3[1] - p1[1]) * k))} ${f(p2[0])},${f(p2[1])}`;
  }
  const area = `${path} L${f(pts[pts.length - 1][0])},${f(y(0))} L${f(pts[0][0])},${f(y(0))} Z`;

  const max = Math.max(...probs), mi = probs.indexOf(max);
  const grid = [0, 50, 100].map(v => `<line x1="${padL}" x2="${f(W - padR)}" y1="${f(y(v))}" y2="${f(y(v))}"/>`).join("")
    + [0, 6, 12, 18, 23].map(h => `<line x1="${f(x(h))}" x2="${f(x(h))}" y1="${f(y(100))}" y2="${f(y(0))}"/>`).join("");
  const xl = [0, 6, 12, 18].map(h => `<text x="${f(x(h))}" y="${f(H - 4)}"${h === 0 ? "" : ` text-anchor="middle"`}>${h}시</text>`).join("");

  const cut = nowH != null ? x(Math.min(23, nowH)) : padL;
  const nowLine = nowH != null
    ? `<line x1="${f(cut)}" x2="${f(cut)}" y1="${f(y(100))}" y2="${f(y(0))}" stroke="${C.sub}" stroke-width="1.5" stroke-dasharray="3 4"/>`
    : "";
  const half = 39;                                   // 최고점 라벨 반폭 추정 → 그래프 밖으로 안 나가게
  const peak = max > 0
    ? `<circle cx="${f(pts[mi][0])}" cy="${f(pts[mi][1])}" r="6" fill="${C.blue}" stroke="${C.card}" stroke-width="2"/>`
      + `<text x="${f(Math.min(W - padR - half, Math.max(padL + half, pts[mi][0])))}" y="${f(pts[mi][1] - 11)}" fill="${C.text}" font-size="14" font-weight="700" text-anchor="middle" ${FONT}>${hours[mi]}시 ${max}%</text>`
    : "";

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="시간별 강수확률 그래프${max > 0 ? `, ${hours[mi]}시 ${max}%가 최고` : ""}">
    <defs>
      <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.blue}" stop-opacity=".55"/><stop offset="1" stop-color="${C.blue}" stop-opacity="0"/></linearGradient>
      <clipPath id="past"><rect x="0" y="0" width="${f(cut)}" height="${H}"/></clipPath>
      <clipPath id="future"><rect x="${f(cut)}" y="0" width="${f(W - cut)}" height="${H}"/></clipPath>
    </defs>
    <g stroke="${C.line}" stroke-width="1">${grid}</g>
    <g fill="${C.sub}" font-size="14" font-weight="500" ${FONT}>${xl}</g>
    <g clip-path="url(#future)"><path d="${area}" fill="url(#rg)"/><path d="${path}" fill="none" stroke="${C.blue}" stroke-width="3" stroke-linejoin="round"/></g>
    <g clip-path="url(#past)" opacity=".5"><path d="${path}" fill="none" stroke="${C.sub}" stroke-width="2.5"/></g>
    ${nowLine}${peak}
  </svg>`;
}

/* ---------- 미세먼지 (기준: PM2.5 15·35·75 / PM10 30·80·150) ---------- */
function grade(v, cuts) {
  if (v <= cuts[0]) return ["좋음", "var(--good)"];
  if (v <= cuts[1]) return ["보통", "var(--ok)"];
  if (v <= cuts[2]) return ["나쁨", "var(--bad)"];
  return ["매우나쁨", "var(--worst)"];
}
let airBusy = false;
async function updateAir() {
  if (airBusy) return;
  airBusy = true;
  const { lat, lon } = CONFIG.LOCATION;
  const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm10,pm2_5&timezone=${encodeURIComponent(TZ)}`;
  try {
    const d = await fetchJSON(url);
    const v25 = d.current && d.current.pm2_5, v10 = d.current && d.current.pm10;
    if (v25 == null || v10 == null) throw new Error("empty");   // 값이 비어 오면 '좋음'으로 잘못 보이지 않게 실패 처리
    const [g25, c25] = grade(Math.round(v25), [15, 35, 75]);
    const [g10, c10] = grade(Math.round(v10), [30, 80, 150]);
    $("w-air").innerHTML = `<span>미세</span><b style="color:${c10}">${g10}</b><span>초미세</span><b style="color:${c25}">${g25}</b>`;
    setStatus("a", "");
  } catch (e) {
    setStatus("a", "미세먼지 갱신 실패");
  } finally {
    airBusy = false;
  }
}

/* ---------- 시세 위젯 (TradingView) ---------- */
function tvTile(src, config, kind) {
  const tile = document.createElement("div");
  tile.className = "tile" + (kind === "screener" ? " screener" : "");
  tile.dataset.kind = kind;
  config.locale = CONFIG.TV_LOCALE;
  const inner = `<div class="tv-inner"><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div></div>`;
  tile.innerHTML = kind === "screener" ? `<div class="clip">${inner}</div>` : inner;
  const s = document.createElement("script");
  s.type = "text/javascript";
  s.async = true;
  s.src = `https://s3.tradingview.com/external-embedding/${src}`;
  s.innerHTML = JSON.stringify(config);
  tile.querySelector(".tradingview-widget-container").append(s);
  return tile;
}
// 무대 크기가 고정이라 배율은 무대 기준 카드 크기로만 계산 (창 배율은 무대 확대가 처리)
function fitTiles() {
  document.querySelectorAll(".tile").forEach(t => {
    if (t.dataset.kind !== "screener") { t.style.setProperty("--z", Math.max(0.5, CONFIG.ZOOM_STOCK).toFixed(3)); return; }
    // 원하는 열까지만 보이도록: 폭(또는 줄 수)에 맞는 배율로 그리고, 그 폭만큼만 잘라서 보여줌
    const S = CONFIG.SCREENER, W = t.clientWidth, H = t.clientHeight;
    if (!W || !H) return;
    const zW = W / S.VISIBLE_W, zR = H / (S.HEAD_PX + S.ROW_PX * S.SHOW_ROWS);
    let z = Math.max(0.5, S.FIT === "rows" ? Math.min(zW, zR) : zW);
    const rowsAt = (zz) => Math.max(1, Math.floor((H / zz - S.HEAD_PX) / S.ROW_PX));
    let rows = Math.min(rowsAt(z), S.SHOW_ROWS);
    // 폭에 맞추면 아래에 한 줄이 채 안 되는 빈칸이 남을 수 있음 → 한 줄 더 넣으려고 줄였을 때
    // 버려지는 면적(좌우 여백)이 아래 빈칸보다 작으면 그쪽을 택함
    if (S.FIT !== "rows" && rows < S.SHOW_ROWS) {
      const z2 = H / (S.HEAD_PX + S.ROW_PX * (rows + 1));
      const wasteNow = (H - (S.HEAD_PX + S.ROW_PX * rows) * z) * W;
      const waste2 = (W - S.VISIBLE_W * z2) * H;
      if (z2 >= 0.5 && waste2 < wasteNow) { z = z2; rows += 1; }
    }
    t.style.setProperty("--z", z.toFixed(3));
    const clip = t.querySelector(".clip");
    clip.style.width = `${S.VISIBLE_W * z}px`;
    clip.style.height = `${(S.HEAD_PX + S.ROW_PX * rows) * z}px`;   // 반쯤 잘린 줄은 안 보이게
    clip.querySelector(".tv-inner").style.width = `${S.INNER_W}px`;
  });
}
function buildMarkets() {
  const rs = $("row-stocks"), rg = $("row-group");
  if (rs.childElementCount && rg.childElementCount) return;   // 이미 그려져 있으면 그대로 둠
  rs.innerHTML = ""; rg.innerHTML = "";
  CONFIG.STOCKS.forEach(([sym, name]) => rs.append(tvTile("embed-widget-symbol-overview.js", {
    symbols: [[name, `${sym}|1D`]], chartOnly: false, width: "100%", height: "100%", autosize: true,
    colorTheme: "dark", isTransparent: true, showVolume: false, showMA: false,
    hideDateRanges: true, hideMarketStatus: false, hideSymbolLogo: false, scalePosition: "right",
    scaleMode: "Normal", noTimeScale: false, valuesTracking: "1", changeMode: "price-and-percent",
    chartType: "area", lineWidth: 2, lineType: 0, dateRanges: ["1d|1"],
  }, "stock")));
  rg.append(tvTile("embed-widget-screener.js", {
    width: "100%", height: "100%", defaultColumn: "overview", defaultScreen: "most_capitalized",
    market: "america", showToolbar: false, colorTheme: "dark", isTransparent: true,
  }, "screener"));
  fitTiles();
  checkMarkets();
}
function clearMarkets() { $("row-stocks").innerHTML = ""; $("row-group").innerHTML = ""; clearTimeout(marketCheck); }

// 네트워크 문제로 위젯 스크립트가 못 들어오면 빈 카드로 남음 → 위젯(iframe)이 안 생긴 카드만 다시 그림
let marketCheck = null;
function checkMarkets(attempt = 1) {
  clearTimeout(marketCheck);
  marketCheck = setTimeout(() => {
    if (body.classList.contains("clockmode") && isNight()) return;           // 밤 시계 모드에서는 위젯을 내려 둠
    const empty = [...document.querySelectorAll(".tile")].filter(t => !t.querySelector("iframe"));
    if (!empty.length) return;
    clearMarkets(); buildMarkets();
    if (attempt < 3) checkMarkets(attempt + 1);
  }, 30000 * attempt);
}

/* ---------- 시계 모드 ----------
   - 야간(00~06시): 자동으로 시계 모드. 누르면 원래 화면 → IDLE_SEC초 동안 안 만지면 다시 시계 모드
   - 06시가 되면 자동 시계 모드는 풀림 (낮에 큰 시계를 눌러 켠 시계 모드는 누를 때까지 유지)
   - 상태는 body의 class/data 값으로 판단 (clockmode = 시계 모드 중, data-clock = auto/manual) */
const isNight = () => {
  const k = partsIn(TZ).mins, s = toMins(CONFIG.NIGHT.start), e = toMins(CONFIG.NIGHT.end);
  return s < e ? (k >= s && k < e) : (k >= s || k < e);
};
let idleTimer = null;                                   // 밤에 원래 화면을 보고 있는 동안만 존재
function armIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { idleTimer = null; if (isNight()) enterClock("auto"); }, CONFIG.NIGHT.IDLE_SEC * 1000);
}
// 모션 기준점: 기본 화면 큰 시계의 중심 (무대 좌표)
function setMotionOrigin() {
  const r = $("clock").getBoundingClientRect(), st = $("stage").getBoundingClientRect();
  if (!r.width) return;
  const ox = `${(r.left + r.width / 2 - st.left) / stageScale}px`, oy = `${(r.top + r.height / 2 - st.top) / stageScale}px`;
  [$("clockview"), $("app")].forEach(el => { el.style.setProperty("--ox", ox); el.style.setProperty("--oy", oy); });
}
function enterClock(reason) {
  clearTimeout(idleTimer); idleTimer = null;
  setMotionOrigin();
  renderAnalog();
  body.classList.add("clockmode");
  body.dataset.clock = reason;
  // 밤에는 시세 위젯을 내려서 CPU 절약 — 모션이 끝난 뒤(0.7초), 그때도 시계 모드일 때만
  setTimeout(() => { if (isNight() && body.classList.contains("clockmode")) clearMarkets(); }, 700);
}
function exitClock() {
  body.classList.remove("clockmode");
  delete body.dataset.clock;
  buildMarkets();                                       // 위젯이 없으면 다시 그림 (있으면 그대로)
  fitTiles();
  if (lastRain) drawRainChart(...lastRain);
  if (isNight()) armIdle();
}
function applyNight() {
  const night = isNight();
  const inClock = body.classList.contains("clockmode");
  if (night && !inClock && !idleTimer) enterClock("auto");                 // 밤인데 아무도 안 보고 있으면 시계 모드
  if (!night && inClock && body.dataset.clock === "auto") exitClock();      // 아침이 되면 자동 시계 모드 해제
  if (!body.classList.contains("clockmode")) buildMarkets();
}
$("clockview").addEventListener("click", exitClock);
// 큰 시계를 누르면 시계 모드 (밤에 누른 경우는 자동 모드로 취급해서 06시에 같이 풀림)
$("clock-set").addEventListener("click", () => enterClock(isNight() ? "auto" : "manual"));
// 밤에 원래 화면을 보는 중이면, 만질 때마다 15초를 다시 셈
document.addEventListener("pointerdown", () => { if (isNight() && !body.classList.contains("clockmode")) armIdle(); }, true);

/* 원형 시계: 눈금·바늘 모양은 한 번만 그리고 회전만 갱신
   - 판: 시트색 원 / 큰 눈금 글자색 2.6 · 작은 눈금 비활성색 1
   - 시침·분침: 칼날형 / 초침: 연세 블루 + 균형추 + 가운데 링 캡 */
function renderAnalog() {
  const svg = $("analog");
  if (!svg.childElementCount) {
    let ticks = "";
    for (let i = 0; i < 60; i++) {
      const major = i % 5 === 0, a = i * 6 * Math.PI / 180, r1 = major ? 78 : 87, r2 = 92;
      ticks += `<line class="tk${major ? " major" : ""}" stroke-width="${major ? 2.6 : 1}" x1="${(100 + r1 * Math.sin(a)).toFixed(2)}" y1="${(100 - r1 * Math.cos(a)).toFixed(2)}" x2="${(100 + r2 * Math.sin(a)).toFixed(2)}" y2="${(100 - r2 * Math.cos(a)).toFixed(2)}"/>`;
    }
    svg.innerHTML = `<circle class="face" cx="100" cy="100" r="97"/>${ticks}`
      + `<path class="hh" d="M100 114 L96.2 100 L98.4 50 L100 46 L101.6 50 L103.8 100 Z"/>`
      + `<path class="mh" d="M100 116 L97.4 100 L99.1 22 L100 18 L100.9 22 L102.6 100 Z"/>`
      + `<g class="sh"><line x1="100" y1="124" x2="100" y2="16" stroke-width="1.2"/><circle cx="100" cy="122" r="3.4"/></g>`
      + `<circle class="cap" cx="100" cy="100" r="3.6"/>`;
  }
  const now = new Date(), p = partsIn(TZ, now), sec = now.getSeconds();
  const hDeg = ((p.h % 12) + p.m / 60 + sec / 3600) * 30, mDeg = (p.m + sec / 60) * 6;
  svg.querySelector(".hh").style.transform = `rotate(${hDeg}deg)`;
  svg.querySelector(".mh").style.transform = `rotate(${mDeg}deg)`;
  svg.querySelector(".sh").style.transform = `rotate(${sec * 6}deg)`;
  svg.setAttribute("aria-label", `아날로그 시계 ${p.h % 12 || 12}시 ${p.m}분`);
  $("digital").textContent = `${pad(p.h)}:${pad(p.m)}`;
  if ($("cv-date").textContent !== $("date").textContent) $("cv-date").textContent = $("date").textContent;
  renderCalendar(p.ymd);
}

/* 미니 달력: 날짜가 바뀐 경우에만 다시 그림 (달이 바뀌면 자동으로 그 달) */
function renderCalendar(ymd) {
  const cal = $("cal");
  if (cal.dataset.ymd === ymd) return;
  cal.dataset.ymd = ymd;
  const [y, m, today] = ymd.split("-").map(Number);
  const first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
  let html = ["일", "월", "화", "수", "목", "금", "토"].map(w => `<div class="w">${w}</div>`).join("");
  html += "<div></div>".repeat(first);
  for (let d = 1; d <= days; d++) {
    const dow = (first + d - 1) % 7;
    const cls = d === today ? "today" : (dow === 0 || dow === 6) ? "we" : "";
    html += `<div class="d ${cls}">${d}</div>`;
  }
  cal.innerHTML = html;
}

/* ---------- 화면 유지 ---------- */
let wakeSentinel = null;
async function keepAwake() {
  try {
    if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
    if (wakeSentinel && !wakeSentinel.released) return;
    wakeSentinel = await navigator.wakeLock.request("screen");
  } catch (e) {}
}
// 처음 화면을 만질 때도 한 번 더 요청 (일부 Safari는 사용자 동작이 있어야 허용)
document.addEventListener("pointerdown", keepAwake, { once: true, capture: true });

/* ---------- 시작 ---------- */
let lastDefaultView = null;
function tick() {
  renderClock(); renderSessions(); applyNight();
  // 18시(오늘→내일)·자정(날짜 바뀜) 경계를 넘으면 5분 주기를 기다리지 않고 바로 날씨 카드 갱신
  const key = defaultView() + partsIn(TZ).ymd;
  if (lastDefaultView !== null && key !== lastDefaultView && !dayPeek) {
    if ($("day").dataset.view !== defaultView()) swapDay(renderDay); else renderDay();
  }
  lastDefaultView = key;
  if (!wakeSentinel || wakeSentinel.released) keepAwake();    // 시스템이 화면 유지를 풀었으면 다시 요청
}
tick(); updateWeather(); updateAir(); keepAwake();
setInterval(tick, 15 * 1000);
// 시계: '다음 초가 바뀌는 순간'(+15ms 여유)에 맞춰 갱신 → 밀려도 늦음이 쌓이지 않음
function secondTick() {
  try {
    const p = partsIn(TZ), hm = `${pad(p.h)}:${pad(p.m)}`;
    if ($("clock").textContent !== hm) renderClock();
    if (body.classList.contains("clockmode")) renderAnalog();
  } catch (e) {
    // 한 번 실패해도 다음 초에 다시 시도 (예외로 고리가 끊겨 시계가 멈추는 것 방지)
  } finally {
    setTimeout(secondTick, 1000 - (Date.now() % 1000) + 15);
  }
}
secondTick();
setInterval(renderDay, 5 * 60 * 1000);                       // '지금' 선 이동, 오늘→내일 전환
setInterval(updateWeather, CONFIG.REFRESH_WEATHER_MIN * 60 * 1000);
setInterval(updateAir, CONFIG.REFRESH_WEATHER_MIN * 60 * 1000);
async function safeReload() {
  try {
    const r = await fetch(location.href.split("#")[0], { cache: "no-store", method: "HEAD" });
    if (r.ok) { location.reload(); return; }
  } catch (e) {}
  setTimeout(safeReload, 5 * 60 * 1000);                     // 연결이 안 되면 5분 뒤 다시 시도
}
setTimeout(safeReload, CONFIG.RELOAD_PAGE_HOURS * 3600 * 1000);

/* ---------- 새 버전 자동 반영 ----------
   GitHub에 올라간 이 파일을 다시 받아서, 지금 화면의 스타일·스크립트와 내용이 다르면 새로고침.
   - ?v=시각을 붙여 GitHub 쪽 저장본(최대 10분)을 건너뜀
   - 줄바꿈 방식(CRLF / LF) 차이는 같은 것으로 취급
   - 받기에 실패하면 아무것도 하지 않음 */
const norm = (t) => (t || "").replace(/\r\n?/g, "\n").trim();
const mySig = norm($("main-css").textContent) + "|" + norm($("main-js").textContent);
async function checkUpdate() {
  if (location.protocol === "file:") return;
  try {
    const r = await fetch(`${location.pathname}?v=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) return;
    const html = await r.text();
    const css = html.match(/<style id="main-css">([\s\S]*?)<\/style>/), js = html.match(/<script id="main-js">([\s\S]*?)<\/script>/);
    if (!css || !js) return;
    if (norm(css[1]) + "|" + norm(js[1]) === mySig) return;
    let last = 0;
    try { last = Number(sessionStorage.getItem("dash-upd") || 0); } catch (e) {}
    if (Date.now() - last < 10 * 60 * 1000) return;                // 10분 안에 이미 바꿔 봤으면 건너뜀 (새로고침 반복 방지)
    try { sessionStorage.setItem("dash-upd", String(Date.now())); } catch (e) {}
    location.replace(`${location.pathname}?v=${Date.now()}`);
  } catch (e) {}
}
setInterval(checkUpdate, CONFIG.UPDATE_CHECK_MIN * 60 * 1000);
window.addEventListener("resize", () => { fitStage(); fitTiles(); });
if ("ResizeObserver" in window) new ResizeObserver(() => lastRain && drawRainChart(...lastRain)).observe($("rain-chart"));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { checkUpdate(); tick(); keepAwake(); updateWeather(); updateAir(); } });
</script>
</body>
</html>
